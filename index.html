    <title>Mohammed Rubel | Connect With Me</title>

    <!-- CSS -->
    <style>
	/* =========================================
   GLOBAL
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #020617;
    --card: rgba(15, 23, 42, 0.78);
    --border: rgba(255, 255, 255, 0.09);
    --text: #ffffff;
    --muted: #94a3b8;
    --primary: #6366f1;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.14), transparent 35%),
        var(--bg);
    color: var(--text);
    overflow-x: hidden;
}


/* =========================================
   CONTAINER
========================================= */

.profile-container {
    position: relative;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 16px;

    overflow: hidden;
}


/* =========================================
   BACKGROUND ORBS
========================================= */

.gradient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: 0.45;
}

.orb-one {
    width: 280px;
    height: 280px;
    background: #4f46e5;
    top: -120px;
    left: -100px;
}

.orb-two {
    width: 300px;
    height: 300px;
    background: #db2777;
    bottom: -140px;
    right: -100px;
}


/* =========================================
   PROFILE CARD
========================================= */

.profile-card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 520px;

    padding: 34px 24px 22px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 30px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);

    animation: cardAppear 0.8s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================
   PROFILE HEADER
========================================= */

.profile-header {
    text-align: center;
}

.profile-image-wrapper {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 18px;
}

.profile-image {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;

    background:
        linear-gradient(135deg, #6366f1, #ec4899);

    border: 4px solid rgba(255,255,255,0.12);

    box-shadow:
        0 12px 35px rgba(99,102,241,0.35);
}

.online-dot {
    position: absolute;

    width: 19px;
    height: 19px;

    background: #22c55e;

    border: 4px solid #0f172a;

    border-radius: 50%;

    right: 3px;
    bottom: 5px;
}

.profile-header h1 {
    font-size: 27px;
    font-weight: 800;

    letter-spacing: -0.8px;

    margin-bottom: 5px;
}

.username {
    color: #a5b4fc;
    font-size: 14px;
    margin-bottom: 15px;
}

.bio {
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;

    margin-bottom: 8px;
}

.intro {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;

    max-width: 360px;
    margin: auto;
}


/* =========================================
   SOCIAL LINKS
========================================= */

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;

    margin-top: 28px;
}

.social-item {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 72px;

    padding: 12px 14px;

    color: white;
    text-decoration: none;

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 18px;

    background: rgba(255,255,255,0.045);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.social-item:hover {
    transform: translateY(-3px) scale(1.01);

    background: rgba(255,255,255,0.09);

    border-color: rgba(255,255,255,0.16);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.2);
}

.social-item:active {
    transform: scale(0.98);
}


/* =========================================
   SOCIAL ICON
========================================= */

.social-icon {
    width: 46px;
    height: 46px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;

    font-size: 20px;
}

.facebook .social-icon {
    background: rgba(24,119,242,0.18);
    color: #60a5fa;
}

.youtube .social-icon {
    background: rgba(255,0,0,0.15);
    color: #ff4d4d;
}

.photography .social-icon {
    background: rgba(168,85,247,0.16);
    color: #c084fc;
}

.tiktok .social-icon {
    background: rgba(255,255,255,0.09);
    color: #ffffff;
}


/* =========================================
   SOCIAL CONTENT
========================================= */

.social-content {
    flex: 1;

    display: flex;
    flex-direction: column;

    margin-left: 14px;

    min-width: 0;
}

.social-content strong {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.social-content small {
    margin-top: 4px;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================================
   ARROW
========================================= */

.arrow {
    margin-left: 10px;

    color: #64748b;

    font-size: 13px;

    transition: 0.25s ease;
}

.social-item:hover .arrow {
    color: white;
    transform: translate(2px, -2px);
}


/* =========================================
   ACTION BUTTONS
========================================= */

.actions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 20px;
}

.action-button {
    border: 0;

    border-radius: 14px;

    padding: 13px 10px;

    cursor: pointer;

    color: white;

    font-family: inherit;
    font-size: 12px;
    font-weight: 600;

    background:
        linear-gradient(135deg, #6366f1, #8b5cf6);

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.action-button:hover {
    transform: translateY(-2px);
}

.action-button:active {
    transform: scale(0.97);
}

.action-button i {
    margin-right: 5px;
}

.action-button.secondary {
    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,255,255,0.08);

    color: #cbd5e1;
}


/* =========================================
   FOOTER
========================================= */

footer {
    text-align: center;

    margin-top: 22px;

    padding-top: 17px;

    border-top: 1px solid rgba(255,255,255,0.06);

    color: #64748b;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;
}


/* =========================================
   TOAST
========================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translate(-50%, 20px);

    padding: 12px 18px;

    background: #1e293b;

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 12px;

    color: white;

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition: 0.3s ease;

    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

    .profile-container {
        padding: 15px;
    }

    .profile-card {
        padding: 30px 17px 20px;

        border-radius: 25px;
    }

    .profile-header h1 {
        font-size: 25px;
    }

    .social-item {
        min-height: 68px;
    }

    .social-icon {
        width: 43px;
        height: 43px;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

<body>

    <!-- JavaScript -->
    <script>
/* =========================================
   SOCIAL PROFILE JAVASCRIPT
========================================= */

document.addEventListener("DOMContentLoaded", function () {

    const shareButton = document.getElementById("shareButton");
    const copyButton = document.getElementById("copyButton");


    /* =====================================
       SHARE PROFILE
    ===================================== */

    shareButton.addEventListener("click", async function () {

        const shareData = {
            title: "Mohammed Rubel",
            text: "Connect with Mohammed Rubel on social media.",
            url: window.location.href
        };


        // Native mobile/browser sharing
        if (navigator.share) {

            try {

                await navigator.share(shareData);

            } catch (error) {

                // User cancelled sharing
                console.log("Share cancelled.");

            }

        } else {

            // Fallback
            copyProfileLink();

        }

    });


    /* =====================================
       COPY PROFILE LINK
    ===================================== */

    copyButton.addEventListener("click", function () {

        copyProfileLink();

    });


    async function copyProfileLink() {

        const url = window.location.href;

        try {

            await navigator.clipboard.writeText(url);

            showToast("Profile link copied!");

        } catch (error) {

            // Older browser fallback
            const textarea = document.createElement("textarea");

            textarea.value = url;

            document.body.appendChild(textarea);

            textarea.select();

            document.execCommand("copy");

            textarea.remove();

            showToast("Profile link copied!");

        }

    }


    /* =====================================
       TOAST MESSAGE
    ===================================== */

    function showToast(message) {

        let toast = document.querySelector(".toast");

        if (!toast) {

            toast = document.createElement("div");

            toast.className = "toast";

            document.body.appendChild(toast);

        }

        toast.textContent = message;

        toast.classList.add("show");


        setTimeout(function () {

            toast.classList.remove("show");

        }, 2200);

    }


    /* =====================================
       LINK CLICK ANALYTICS PLACEHOLDER
    ===================================== */

    const socialLinks = document.querySelectorAll(".social-item");

    socialLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            console.log(
                "Social link clicked:",
                link.querySelector("strong")?.textContent
            );

        });

    });

});</script>
